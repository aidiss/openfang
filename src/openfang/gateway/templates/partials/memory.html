<!-- Add form -->
<form hx-post="/memory" hx-target="#memory-panel" hx-swap="innerHTML" class="mb-3 space-y-2">
    <input type="text" name="key" placeholder="key" class="w-full px-2 py-1 text-xs border rounded">
    <input type="text" name="value" placeholder="value" class="w-full px-2 py-1 text-xs border rounded">
    <button type="submit" class="w-full px-2 py-1 text-xs bg-blue-500 text-white rounded hover:bg-blue-600">Add</button>
</form>

{% if items %}
<ul class="space-y-1">
    {% for item in items %}
    <li class="text-xs p-2 bg-gray-50 rounded group">
        <div class="flex justify-between items-start">
            <span class="font-medium text-gray-700">{{ item.key }}</span>
            <button hx-delete="/memory/{{ item.key }}"
                    hx-target="#memory-panel"
                    hx-swap="innerHTML"
                    class="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100">×</button>
        </div>
        <div class="text-gray-500 truncate" title="{{ item.value }}">{{ item.value[:50] }}</div>
    </li>
    {% endfor %}
</ul>
{% else %}
<div class="text-gray-400 text-xs">No memory keys</div>
{% endif %}
