<!-- Add form -->
<form hx-post="/cron" hx-target="#cron-panel" hx-swap="innerHTML" class="mb-3 space-y-2">
    <input type="text" name="schedule" placeholder="*/5 * * * *" class="w-full px-2 py-1 text-xs border rounded">
    <input type="text" name="task" placeholder="task description" class="w-full px-2 py-1 text-xs border rounded">
    <button type="submit" class="w-full px-2 py-1 text-xs bg-blue-500 text-white rounded hover:bg-blue-600">Add</button>
</form>

{% if jobs %}
<ul class="space-y-2">
    {% for job in jobs %}
    <li class="text-xs p-2 bg-gray-50 rounded group">
        <div class="flex justify-between items-center">
            <span class="font-medium">{{ job.id }}</span>
            <div class="flex items-center gap-2">
                <span class="{% if job.enabled %}text-green-600{% else %}text-gray-400{% endif %}">
                    {{ "on" if job.enabled else "off" }}
                </span>
                <button hx-delete="/cron/{{ job.id }}"
                        hx-target="#cron-panel"
                        hx-swap="innerHTML"
                        class="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100">×</button>
            </div>
        </div>
        <div class="text-gray-500 mt-1">{{ job.schedule }}</div>
        <div class="text-gray-600 truncate">{{ job.task[:40] }}</div>
    </li>
    {% endfor %}
</ul>
{% else %}
<div class="text-gray-400 text-xs">No cron jobs</div>
{% endif %}
